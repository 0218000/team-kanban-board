<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队任务看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>团队任务看板</h1>
            <button id="addTaskBtn" class="add-btn">+ 新建任务</button>
        </header>

        <div class="board">
            <div class="column" data-status="todo">
                <h2>待办</h2>
                <div class="task-list"></div>
            </div>
            <div class="column" data-status="doing">
                <h2>进行中</h2>
                <div class="task-list"></div>
            </div>
            <div class="column" data-status="done">
                <h2>已完成</h2>
                <div class="task-list"></div>
            </div>
        </div>
    </div>

    <!-- 弹窗表单 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>新建任务</h3>
            <div class="form-item">
                <label>任务标题</label>
                <input type="text" id="taskTitle" placeholder="请输入标题">
            </div>
            <div class="form-item">
                <label>任务描述</label>
                <textarea id="taskDesc" placeholder="简单描述任务"></textarea>
            </div>
            <div class="form-item">
                <label>优先级</label>
                <select id="taskPriority">
                    <option value="low">低</option>
                    <option value="mid" selected>中</option>
                    <option value="high">高</option>
                </select>
            </div>
            <div class="form-item">
                <label>负责人</label>
                <input type="text" id="taskOwner" placeholder="填写名字">
            </div>
            <button id="saveTaskBtn" class="save-btn">保存任务</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
