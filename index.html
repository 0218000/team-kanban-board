<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>团队任务看板</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>团队任务看板</h1>
        <button id="addTaskBtn">+ 新增任务</button>
        <div class="board">
            <div class="column" data-status="todo">
                <h3>待办 todo</h3>
                <div class="task-list"></div>
            </div>
            <div class="column" data-status="doing">
                <h3>进行中 doing</h3>
                <div class="task-list"></div>
            </div>
            <div class="column" data-status="done">
                <h3>已完成 done</h3>
                <div class="task-list"></div>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>添加新任务</h3>
            <input type="text" id="taskTitle" placeholder="任务标题">
            <textarea id="taskDesc" placeholder="任务描述"></textarea>
            <select id="taskPriority">
                <option value="普通">普通</option>
                <option value="紧急">紧急</option>
            </select>
            <input type="text" id="taskOwner" placeholder="负责人">
            <div class="btn-group">
                <button id="saveTaskBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
