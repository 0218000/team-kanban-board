<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队任务看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>团队任务看板</h1>
        <!-- 新增搜索框 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索任务标题/描述/负责人">
        </div>
        <button class="add-btn" onclick="openAddModal()">+ 新增任务</button>
        <div class="board">
            <div class="column" id="todo">
                <h2>待办 Todo</h2>
                <div class="task-list"></div>
            </div>
            <div class="column" id="doing">
                <h2>进行中 Doing</h2>
                <div class="task-list"></div>
            </div>
            <div class="column" id="done">
                <h2>已完成 Done</h2>
                <div class="task-list"></div>
            </div>
        </div>
    </div>

    <!-- 新增任务弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>添加新任务</h3>
            <input type="text" id="taskTitle" placeholder="任务标题（必填）">
            <textarea id="taskDesc" placeholder="任务描述"></textarea>
            <select id="taskPriority">
                <option value="low">低优先级</option>
                <option value="mid" selected>中优先级</option>
                <option value="high">高优先级</option>
            </select>
            <input type="text" id="taskOwner" placeholder="负责人">
            <button onclick="saveTask()">保存任务</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
